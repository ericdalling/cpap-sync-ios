name: CPAPSync
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CPAPSyncCore:
    path: Packages/CPAPSyncCore
targets:
  CPAPSync:
    type: application
    platform: iOS
    sources: [CPAPSync]
    dependencies:
      - package: CPAPSyncCore
    info:
      path: CPAPSync/GeneratedInfo.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "CPAP Sync"
        # Modern iPhones require an explicit launch screen declaration to avoid
        # legacy compatibility letterboxing. A blank dict uses the system launch screen.
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Connect to your ez Share Wi-Fi SD card to download CPAP therapy files."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericdalling.cpapsync
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: CPAP Sync
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  CPAPSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CPAPSyncTests]
    dependencies:
      - target: CPAPSync
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ericdalling.cpapsync.tests
  CPAPSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CPAPSyncUITests]
    dependencies:
      - target: CPAPSync
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ericdalling.cpapsync.uitests
        TEST_TARGET_NAME: CPAPSync
schemes:
  CPAPSync:
    build:
      targets:
        CPAPSync: all
        CPAPSyncTests: [test]
        CPAPSyncUITests: [test]
    test:
      targets:
        - CPAPSyncTests
        - CPAPSyncUITests
      gatherCoverageData: true
    archive:
      config: Release
