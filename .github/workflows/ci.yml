name: iOS CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap
        run: |
          xcodebuild -version
          bash scripts/bootstrap.sh
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project CPAPSync.xcodeproj -scheme CPAPSync -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO test | tee build/test.log
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            build/Tests.xcresult
            build/test.log
          if-no-files-found: warn
          retention-days: 7
