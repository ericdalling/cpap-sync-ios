name: iOS CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Cancel superseded PRs; every main run gets its own group and release.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Bootstrap
        run: |
          xcodebuild -version
          bash scripts/bootstrap.sh
      - name: Test
        run: bash scripts/test-ios.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: |
            build/Tests.xcresult
            build/test.log
          if-no-files-found: warn
          retention-days: 7
      - name: Package unsigned device build
        run: bash scripts/package-preview.sh
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/preview/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: preview
      - name: Verify package integrity
        working-directory: preview
        run: |
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          with open("build-info.json") as f:
              info = json.load(f)
          assert info["commit"] == os.environ["GITHUB_SHA"]
          assert info["run_id"] == os.environ["GITHUB_RUN_ID"]
          assert info["run_attempt"] == os.environ["GITHUB_RUN_ATTEMPT"]
          assert info["signing"] == "unsigned"
          PY
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: preview
        run: |
          set -euo pipefail
          tag="main-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          # Draft first: incomplete uploads must not become published releases.
          gh release create "$tag" ./*.ipa ./*-dSYMs.zip SHA256SUMS.txt build-info.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "CPAP Sync main build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release-notes.md --draft --prerelease --latest=false
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
