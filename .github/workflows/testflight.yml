name: TestFlight
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['iOS CI']
    types: [completed]
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  verify:
    # workflow_run is a privileged event: allow only successful push runs on our own main.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - name: Resolve version
        run: bash scripts/resolve-version.sh testflight >> "$GITHUB_ENV"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: bash scripts/validate-release-tag.sh "$GITHUB_REF_NAME" "$APP_VERSION" "$(git rev-parse HEAD)"
      - name: Validate release tag tests
        run: bash scripts/test-release-tag.sh
      - name: Bootstrap and test for manual/tag runs
        if: github.event_name != 'workflow_run'
        run: |
          bash scripts/bootstrap.sh
          bash scripts/test-ios.sh
  release:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve version
        run: bash scripts/resolve-version.sh testflight >> "$GITHUB_ENV"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: bash scripts/validate-release-tag.sh "$GITHUB_REF_NAME" "$APP_VERSION" "$(git rev-parse HEAD)"
      - name: Bootstrap
        run: bash scripts/bootstrap.sh
      - name: Archive, sign and upload
        env:
          SIGNING_MODE: ${{ vars.IOS_SIGNING_MODE || 'automatic' }}
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash scripts/release.sh
