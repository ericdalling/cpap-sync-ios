name: TestFlight
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted commit
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Bootstrap and test
        run: |
          bash scripts/bootstrap.sh
          bash scripts/test-ios.sh
  release:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bootstrap
        run: bash scripts/bootstrap.sh
      - name: Archive, sign and upload
        env:
          SIGNING_MODE: ${{ vars.IOS_SIGNING_MODE || 'automatic' }}
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: bash scripts/release.sh
